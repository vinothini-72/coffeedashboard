<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coffee Dashboard Info</title>
<style>
    /* General body styles */
    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #fff8f0, #f0e4d7);
        color: #4b2e2b;
        text-align: center;
        padding: 20px;
        overflow-x: hidden;
    }

    /* Title */
    h1 {
        color: #6f4e37;
        font-size: 36px;
        margin-bottom: 10px;
        animation: fadeInDown 1s;
    }

    /* Coffee cup animation */
    .coffee-icon {
        width: 100px;
        margin: 15px;
        animation: bounce 2s infinite;
    }

    /* Stats cards container */
    .stats {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin: 30px 0;
        flex-wrap: wrap;
    }

    /* Individual stat cards */
    .stat-card {
        background-color: #fff4e0;
        padding: 20px 30px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        width: 180px;
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
    }
    .stat-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 12px 20px rgba(0,0,0,0.3);
    }

    /* Numbers in cards */
    .stat-number {
        font-size: 32px;
        font-weight: bold;
        color: #c75d2c;
        animation: fadeInUp 1s;
    }
    .stat-label {
        font-size: 16px;
        margin-top: 8px;
        color: #6f4e37;
    }

    /* Quick facts list */
    .facts {
        max-width: 450px;
        margin: 0 auto;
        text-align: left;
        padding: 20px;
        background-color: #fff3e6;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        animation: fadeIn 1.5s;
    }

    .facts h3 {
        margin-bottom: 10px;
        color: #6f4e37;
    }

    .facts ul {
        list-style-type: square;
        padding-left: 20px;
        color: #4b2e2b;
    }

    /* Animations */
    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-20px); }
        60% { transform: translateY(-10px); }
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-30px);}
        to { opacity: 1; transform: translateY(0);}
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px);}
        to { opacity: 1; transform: translateY(0);}
    }

    @keyframes fadeIn {
        from { opacity: 0;}
        to { opacity: 1;}
    }
</style>
</head>
<body>

<!-- Coffee icon -->
<img src="https://cdn-icons-png.flaticon.com/512/2274/2274302.png" alt="Coffee" class="coffee-icon">

<!-- Title -->
<h1>Coffee Sales Dashboard</h1>
<p>Welcome! Explore top cities, coffee types, and revenue trends.</p>

<!-- Stats cards -->
<div class="stats">
    <div class="stat-card">
        <div class="stat-number" id="totalRevenue">0</div>
        <div class="stat-label">Total Revenue</div>
    </div>
    <div class="stat-card">
        <div class="stat-number" id="topCity">--</div>
        <div class="stat-label">Top City</div>
    </div>
    <div class="stat-card">
        <div class="stat-number" id="topCoffee">--</div>
        <div class="stat-label">Top Coffee Type</div>
    </div>
</div>

<!-- Quick facts -->
<div class="facts">
    <h3>Quick Facts:</h3>
    <ul>
        <li>Track daily & monthly coffee sales</li>
        <li>Identify top coffee types and top cities</li>
        <li>Forecast future sales trends</li>
        <li>Interactive slicers for date</li>
    </ul>
</div>

<!-- JavaScript for animated stats -->
<script>
// Demo stats — replace with dynamic data later
let totalRevenue = 12500;
let topCity = "Chennai";
let topCoffee = "Espresso";

function animateValue(id, value) {
    let current = 0;
    let step = value / 100;
    let interval = setInterval(() => {
        current += step;
        if(current >= value) current = value;
        document.getElementById(id).innerText = Math.floor(current);
        if(current >= value) clearInterval(interval);
    }, 20);
}

// Set top city and coffee type
document.getElementById('topCity').innerText = topCity;
document.getElementById('topCoffee').innerText = topCoffee;
animateValue('totalRevenue', totalRevenue);
</script>

</body>
</html>
